:root{
  --crust:#11111b;--mantle:#181825;--base:#1e1e2e;--s0:#313244;--s1:#45475a;--s2:#585b70;
  --text:#cdd6f4;--sub:#9399b2;--sub2:#a6adc8;--line:#242531;
  --rail:#1e1e2e;--panel:#181825;--head:#181825;--hover:#2a2b3c;--active:#3c3e4f;--search:#3c3e4f;
  --chat:#11111b;--in:#1e1e2e;--out:#403855;--pill:#181825;--chipon:#4e4365;
  --accent:#cba6f7;--accent2:#b48ef0;--green:#a6e3a1;--blue:#53bdeb;--link:#89b4fa;--mark:color-mix(in srgb,var(--yellow) 35%,transparent);
  --pop:#252536;--wave:#4c8b7f;--wave2:#94e2d5;--dot:#52bae7;

  --onaccent:#1e1e2e;--accenth:color-mix(in srgb,var(--accent) 78%,#fff);--danger:#f38ba8;--chiptext:#e6dcff;--outmeta:#b3aacb;--sheet:#1d1d2b;--yellow:#f9e2af;--orange:#fab387;--tint:#ffffff0f;--playc:#cad3f1;

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%;background:var(--crust);color:var(--text);
  font-family:"WA Arabic","Segoe UI","Helvetica Neue",Helvetica,Roboto,"Noto Sans Arabic","Noto Sans",Arial,sans-serif;font-size:14.2px;overflow:hidden;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
svg{flex:none}
.app{display:flex;height:100vh;height:100dvh;height:var(--vvh,100dvh)}
.ibtn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:var(--sub2);flex:none;transition:background-color .15s,color .15s,transform .12s var(--ease)}
.ibtn:hover{background:var(--tint);color:var(--text)}.ibtn:active{transform:scale(.9)}
.ibtn.on{background:var(--tint);color:var(--text)}
.ibtn.sm{width:28px;height:28px}.ibtn:disabled{opacity:.35;pointer-events:none}
.ibtn.pri{background:var(--accent);color:var(--onaccent)}.ibtn.pri:hover{background:var(--accenth);color:var(--onaccent)}
/* side rail */
.rail{width:64px;background:var(--rail);display:flex;flex-direction:column;align-items:center;padding:10px 0;gap:6px;border-right:1px solid var(--line)}
.rail .ic{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:var(--sub2);position:relative;transition:background-color .18s,color .18s,transform .12s var(--ease)}
.rail .ic:hover{background:var(--tint);color:var(--text)}.rail .ic:active{transform:scale(.9)}
.rail .ic.on{background:var(--s0);color:var(--accent)}
.rail hr{width:32px;border:0;border-top:1px solid var(--s0);margin:6px 0}
.rail .sp{flex:1}
.badge{position:absolute;top:1px;right:-1px;min-width:18px;height:18px;border-radius:9px;background:var(--accent);color:var(--onaccent);font-size:10.5px;font-weight:700;display:grid;place-items:center;padding:0 4px}
.badge:empty{display:none}
/* side panes */
.side{width:min(440px,32vw);min-width:320px;position:relative;overflow:hidden;border-right:1px solid var(--line);background:var(--panel)}
.pane{position:absolute;inset:0;display:flex;flex-direction:column;transition:opacity .22s var(--ease),transform .22s var(--ease),visibility 0s}
.pane.off{opacity:0;transform:translateX(-24px);pointer-events:none;visibility:hidden;transition:opacity .2s,transform .2s,visibility 0s .2s}
.phead{display:flex;align-items:center;gap:6px;margin:10px 14px 10px 20px;min-height:44px}
.phead h1{font-size:22px;font-weight:700;margin:0;flex:1;letter-spacing:.1px}
.phead{gap:2px}.phead .ibtn{color:var(--sub2)}
.sbox{margin:0 16px;position:relative}
.sbox input{width:100%;height:40px;background:var(--search);border:0;border-radius:22px;color:var(--text);padding:0 16px 0 48px;font:inherit;font-size:15px;outline:none;transition:box-shadow .15s}
.sbox input::placeholder{color:var(--sub)}
.sbox input:focus{box-shadow:0 0 0 2px var(--accent) inset}
.sbox>svg{position:absolute;left:17px;top:11px;color:var(--sub);pointer-events:none}
.shint{margin:5px 20px 0;font-size:11.5px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chips{display:flex;gap:8px;padding:12px 16px 8px;flex-wrap:wrap}
.chip{padding:0 12px;height:32px;border-radius:18px;color:var(--sub2);font-size:14.5px;border:1px solid var(--s1);transition:background-color .15s,color .15s,border-color .15s,transform .12s var(--ease)}
.chip:hover{background:var(--tint)}.chip:active{transform:scale(.94)}
.chip.on{background:var(--chipon);border-color:var(--chipon);color:var(--chiptext)}
.list{flex:1;overflow-y:auto;contain:strict;padding:0}
.row{display:flex;gap:14px;padding:0 14px 0 12px;margin:0 10px;height:72px;align-items:center;cursor:pointer;border-radius:12px;transition:background-color .12s}
.row:hover{background:var(--hover)}.row.on{background:var(--active)}
.av{width:49px;height:49px;border-radius:50%;flex:none;display:grid;place-items:center;font-weight:600;font-size:18px;color:#1e1e2e;position:relative;overflow:hidden}
.av img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.rbody{flex:1;min-width:0;height:100%;display:flex;flex-direction:column;justify-content:center;gap:3px}
.rtop,.rbot{display:flex;justify-content:space-between;gap:6px;align-items:center}
.rname{font-size:16.5px;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;unicode-bidi:plaintext}
.rtime{font-size:12px;color:var(--sub);flex:none}
.rprev{font-size:14px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;unicode-bidi:plaintext;text-align:left}
.rprev .tick{color:var(--sub)}
.rbot>.rprev{flex:1;min-width:0}
.ub{flex:none;min-width:22px;height:22px;padding:0 4px;border-radius:11px;background:var(--accent);color:var(--onaccent);font-size:12px;font-weight:700;line-height:22px;text-align:center;font-variant-numeric:tabular-nums;white-space:nowrap}
.row.unr .rname{font-weight:700}.row.unr .rtime{color:var(--accent);font-weight:500}
.sres{padding:10px 16px;margin:0 10px;border-radius:12px;cursor:pointer;transition:background-color .12s}
.sres:hover{background:var(--hover)}
.sres .rprev{white-space:normal;max-height:3.9em;overflow:hidden}
.shead{padding:14px 26px 6px;color:var(--accent);font-size:14px}
mark{background:var(--mark);color:inherit;border-radius:2px}
mark.hl{background:color-mix(in srgb,var(--yellow) 30%,transparent)}
mark.hl.cur{background:var(--orange);color:var(--onaccent);box-shadow:0 0 0 2px var(--orange)}
/* saved panel */
.blist{flex:1;overflow-y:auto}
.bgrp{padding:14px 26px 6px;color:var(--accent);font-size:13.5px;display:flex;justify-content:space-between}
.bgrp small{color:var(--sub)}
.bm{position:relative;padding:10px 16px;margin:0 10px;border-radius:12px;cursor:pointer;transition:background-color .12s}
.bm:hover{background:var(--hover)}
.bm .rtop{gap:10px}
.bml{font-size:15.5px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;unicode-bidi:plaintext}
.bml::before{content:"★ ";color:var(--yellow)}
.bmchat{font-size:12.5px;color:var(--accent);margin:2px 0;display:flex;gap:6px;align-items:center;unicode-bidi:plaintext}
.bmchat .tg{background:var(--s0);color:var(--sub2);border-radius:10px;padding:0 7px;font-size:11.5px}
.bm .rprev{white-space:normal;max-height:2.8em;overflow:hidden;font-size:13.5px}
.bmnote{font-size:12.5px;color:var(--sub2);font-style:italic;margin-top:3px;white-space:pre-wrap;unicode-bidi:plaintext}
.bmact{position:absolute;right:10px;bottom:6px;display:flex;gap:2px;opacity:0;transform:translateY(4px);transition:opacity .15s,transform .15s}
.bm:hover .bmact{opacity:1;transform:none}
.bmact .ibtn{background:var(--s0)}
.bempty{padding:40px 30px;text-align:center;color:var(--sub);line-height:1.8}
/* conversation */
.main{flex:1;display:flex;flex-direction:column;min-width:0;background:var(--chat);position:relative;overflow:hidden}
.chead{height:64px;background:var(--head);display:flex;align-items:center;gap:12px;padding:0 12px 0 16px;flex:none;position:relative;z-index:3;transition:box-shadow .15s}
.chead.drop{box-shadow:inset 0 0 0 2px var(--accent)}
.chead .av{width:40px;height:40px;font-size:15px}
.havw{border-radius:50%;position:relative;flex:none}
.havw{cursor:pointer}
.havw::after{content:"📷";position:absolute;inset:0;border-radius:50%;background:#11111baa;display:grid;place-items:center;font-size:15px;opacity:0;transition:opacity .15s}
.chead.drop .havw::after{opacity:1}
.chead .t{flex:1;min-width:0;cursor:pointer}
.chead .t b{font-weight:500;font-size:16px;display:block;unicode-bidi:plaintext;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chead .t small{color:var(--sub);font-size:13px;display:block;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hsep{width:1px;height:24px;background:var(--s0);margin:0 4px}
#cdate{position:absolute;opacity:0;pointer-events:none;width:1px;height:1px;right:60px;top:40px;color-scheme:dark}
.main{background-color:var(--chat);background-image:var(--wall);background-size:420px 420px}
.wall{flex:1;overflow-y:auto;padding:0 6% 12px;overflow-anchor:none;position:relative;background:transparent}
.wall.in{animation:wallIn .26s var(--ease)}
@keyframes wallIn{from{opacity:0;transform:translateX(16px)}to{opacity:1;transform:none}}
.ltop{height:44px;display:flex;align-items:center;justify-content:center}
.ltop>*{display:none}
.ltop.st .lst{display:inline-block}.ltop.more .ldots{display:flex}
.lst{background:var(--pill);color:var(--yellow);font-size:12px;padding:6px 12px;border-radius:8px}
.ldots{gap:5px}.ldots i{width:6px;height:6px;border-radius:50%;background:var(--sub);animation:dot 1s infinite alternate}
.ldots i:nth-child(2){animation-delay:.2s}.ldots i:nth-child(3){animation-delay:.4s}
@keyframes dot{from{opacity:.25}to{opacity:1}}
.lbot{height:4px}
.empty{flex:1;display:grid;place-items:center;color:var(--sub);text-align:center;animation:fadeIn .3s}
.empty h2{color:var(--text);font-weight:300;font-size:32px;margin:20px 0 8px}
.day{display:flex;justify-content:center;margin:12px 0 10px}
.day span,.fday{background:var(--pill);color:var(--sub2);font-size:12.5px;font-weight:500;padding:6px 12px;border-radius:8px;box-shadow:0 1px 1px #0005}
.fday{position:absolute;top:76px;left:50%;transform:translate(-50%,-6px);z-index:3;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s var(--ease)}
.fday.show{opacity:1;transform:translate(-50%,0)}
.sys{display:flex;justify-content:center;margin:8px 0;position:relative}
.sys span{background:var(--pill);color:var(--sub2);font-size:12.5px;padding:6px 12px;border-radius:8px;text-align:center;max-width:80%;position:relative}
.m{display:flex;margin:2px 0;position:relative}
.m.o{justify-content:flex-end}
.m.first{margin-top:12px}
.m.g{padding-left:40px}
.sav{position:absolute;left:2px;top:0;width:30px;height:30px;border-radius:50%;cursor:pointer;transition:transform .12s var(--ease)}
.sav:hover{transform:scale(1.06)}
.sav .av{width:30px;height:30px;font-size:12px}
@keyframes fadeIn{from{opacity:0}}
.b{position:relative;max-width:min(65%,560px);background:var(--in);color:var(--text);border-radius:8px;padding:6px 7px 8px 9px;box-shadow:0 1px .5px #0004;overflow-wrap:anywhere}
.m.o .b{background:var(--out)}
.m.first:not(.o) .b{border-top-left-radius:0}
.m.first.o .b{border-top-right-radius:0}
.m.first:not(.o) .b::before{content:"";position:absolute;left:-8px;top:0;border:solid transparent;border-top-color:var(--in);border-right-color:var(--in);border-width:0 8px 13px 0}
.m.first.o .b::before{content:"";position:absolute;right:-8px;top:0;border:solid transparent;border-top-color:var(--out);border-left-color:var(--out);border-width:0 0 13px 8px}
.m.flash .b::after,.sys.flash span::after{content:"";position:absolute;inset:0;border-radius:inherit;background:#ffffff2e;pointer-events:none;animation:fl 1.6s forwards}
@keyframes fl{0%,45%{opacity:1}100%{opacity:0}}
.mbtn{position:absolute;top:0;right:0;width:46px;height:30px;padding:3px 4px 0 0;border-radius:0 8px 0 0;display:flex;justify-content:flex-end;align-items:flex-start;color:var(--sub2);opacity:0;transition:opacity .15s;z-index:2;outline:none;
  background:radial-gradient(farthest-side at top right,var(--in) 50%,transparent)}
.m.o .mbtn{background:radial-gradient(farthest-side at top right,var(--out) 50%,transparent)}

/* word diff between two edit versions: LCS over whitespace-split words; null when the table would be too big */
// ponytail: O(n*m) table on the middle (common head/tail words trimmed first), no diff past 4e4 cells; upgrade to Myers if long rewrites need marks
function wdiff(A,B){
  const n=A.length,m=B.length;let s=0,e=0;
  while(s<n&&s<m&&A[s][0]===B[s][0])s++;

  const x=A.slice(s,n-e),y=B.slice(s,m-e),p=x.length,q=y.length;if(p*q>4e4)return null;

function recSend(){const R=REC;if(!R||R.end)return;R.end=1;RP=null;recDetach();const secs=Math.floor(recSecs(R));
  const fin=()=>{const type=R.mr.mimeType||"audio/webm",b=new Blob(R.chunks,{type}),ext=type.includes("ogg")?"ogg":type.includes("mp4")?"m4a":"webm";recEnd();
    const rp=takeReply(R.c);pendAdd(R.c,{k:"ptt",d:secs,q:rp?.q,send:async()=>sendApi({chat:String(R.c.id),type:"ptt",upload:await upload(b,"voice."+ext),reply:rp?.ref})})};
  if(R.mr.state==="inactive")fin();else{R.mr.onstop=fin;R.mr.stop()}}
function recDiscard(){const R=REC;if(!R)return;R.end=1;recOff();R.mr.onstop=null;if(R.mr.state!=="inactive")R.mr.stop();recEnd()}
function recEnd(){const R=REC;if(!R)return;REC=null;cancelAnimationFrame(R.raf);R.src.disconnect();micRelease();recUI(false)}
function composerReset(){recDiscard();recOff();REPLY=null;PANEL=null;GQ=null;attShow(false)}

/* ---------- microphone: opened on press, released the moment the recording ends (sent, cancelled or deleted), so the phone drops its mic indicator ---------- */
let MICS=null;
async function micGet(){
  if(!MICS||!MICS.st.getAudioTracks().some(t=>t.readyState==="live")){const st=await navigator.mediaDevices.getUserMedia({audio:true});const ac=new(window.AudioContext||window.webkitAudioContext)();MICS={st,ac,an:ac.createAnalyser()};MICS.an.fftSize=256}
  MICS.ac.resume?.().catch(()=>{});return MICS}
function micRelease(){const m=MICS;MICS=null;if(!m)return;m.st.getTracks().forEach(t=>t.stop());m.ac.close().catch(()=>{})}
/* ---------- multi-select: "تحديد" in the message menu, or Ctrl/Shift-click ---------- */
let SEL=null,SELA=null;
const IC_FWD=svg("M14 5l6 6-6 6M20 11H9a5 5 0 0 0-5 5v3",20,1.9),IC_CP=svg("M9 9h10v11H9zM5 15V5h10",20,1.9);
const selList=()=>SEL?msgs.map((m,i)=>({i,m})).filter(x=>x.m.id&&SEL.has(x.m.id)):[];
const refOf=i=>({c:cur,i,m:msgs[i],key:msgs[i]?.id});
function selPaint(){const h=$("#chead");if(!h)return;h.classList.toggle("sel",!!SEL);W?.classList.toggle("selecting",!!SEL);
  const sc=$("#selc");if(sc&&SEL)sc.textContent=SEL.size.toLocaleString(LOC[LANG])+tr(" محددة");
  BOX?.querySelectorAll(".m[data-i]").forEach(el=>{const m=msgs[+el.dataset.i],on=!!SEL&&!!m?.id&&SEL.has(m.id);el.classList.toggle("sel",on);el.querySelector(".ck")?.classList.toggle("on",on)})}
function selStart(i){closePop();if(!msgs[i]?.id)return;SEL=new Set();SELA=null;selToggle(i)}
function selToggle(i,range){const m=msgs[i];if(!m?.id||m.ps)return;SEL=SEL||new Set();
  if(range&&SELA!=null){for(let k=Math.min(SELA,i),b=Math.max(SELA,i);k<=b;k++){const x=msgs[k];if(x?.id&&!x.ps)SEL.add(x.id)}}
  else SEL.has(m.id)?SEL.delete(m.id):SEL.add(m.id);
  SELA=i;if(!SEL.size){exitSel();return}selPaint()}
function exitSel(){if(!SEL)return false;SEL=null;SELA=null;selPaint();return true}
const selFwd=()=>{const L=selList();if(L.length)forwardDlg(L,exitSel)};
function selCopy(){const L=selList(),who=m=>m.f?tr("أنت"):(cur.g?senderName(m.s):dn(cur));if(!L.length)return;
  copyText(L.map(({m})=>`[${hm(m.t)}, ${ymd(m.t)}] ${who(m)}: ${previewOf(m)}`).join("\n"));exitSel()}
async function selDl(){const L=selList().filter(x=>x.m.m);if(!L.length){toast(tr("لا توجد وسائط في التحديد"),{ms:2000});return}
  for(const{m}of L){dlMsg(m);await new Promise(r=>setTimeout(r,350))}toast(`${tr("بدأ تحميل")} ${L.length}`,{ms:2000})}
const selDel=()=>{const L=selList();if(L.length)delDlg(L.map(({i})=>refOf(i)),{pre:"me",done:exitSel})};
/* ---------- camera: the composer's camera button opens a sheet with two native capture inputs (photo / video) ---------- */
document.addEventListener("pointerdown",e=>{for(const[id,ex]of[["#asheet","#asheet,#catt"],["#csheet","#csheet,#ccam"]]){const a=$(id);if(a&&!a.hidden&&!e.target.closest(ex))a.hidden=true}},true);
// the sticker / GIF / emoji panel stays open after a send; it closes on an outside tap, Esc or back
document.addEventListener("pointerdown",e=>{if(PANEL&&!e.target.closest("#cpanel,#cemo,.pop,.dlg-bg,#toasts"))closePanel()},true);

/* ---------- inline voice player (media sheet) ---------- */
let mvp=null;
const vkey=r=>r[0]+"|"+r[1];
const STOPI=`<svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>`;
function mvpTimes(){const a=mvp?.audio;const t=a?a.currentTime:0,D=a&&isFinite(a.duration)?a.duration:0;return{t,D,f:D?Math.min(1,t/D):0,txt:`${dur(Math.floor(t))||"0:00"} / ${D?dur(Math.round(D))||"0:00":"…"}`}}
function mvpStop(){if(!mvp)return;const k=mvp.k;cancelAnimationFrame(mvp.raf);mvp.audio.pause();mvp.audio.remove();mvp=null;mvpPaint(k);mvpBar()}
function mvpPlay(r,frac){
  if(mvp&&mvp.k===vkey(r)){if(frac!=null)return mvpSeek(frac);mvp.audio.paused?mvp.audio.play().catch(()=>{}):mvp.audio.pause();return}
  mvpStop();if(!r[4]){toast(tr("الرسالة الصوتية غير محفوظة"));return}
  const a=document.createElement("audio");a.preload="none";a.hidden=true;a.src=src(r[4]);document.body.append(a);
  mvp={k:vkey(r),r,audio:a,seek:frac||0};
  a.addEventListener("loadedmetadata",()=>{if(mvp?.audio===a&&mvp.seek>0&&isFinite(a.duration)){a.currentTime=mvp.seek*a.duration;mvp.seek=0}a.playbackRate=vrate;mvpPaint()});
  a.addEventListener("play",()=>{a.playbackRate=vrate;mvpPaint();cancelAnimationFrame(mvp?.raf);mvpLoop()});
  a.addEventListener("pause",()=>mvpPaint());a.addEventListener("ended",()=>{if(mvp?.audio===a)mvpStop()});
  a.playbackRate=vrate;a.play().catch(e=>{if(e.name!=="AbortError")toast(tr("تعذر تشغيل الرسالة الصوتية"))});mvpBar();mvpPaint();
}
function mvpSeek(f){if(!mvp)return;const a=mvp.audio;f=Math.max(0,Math.min(1,f));if(isFinite(a.duration)&&a.duration>0)a.currentTime=f*a.duration;else mvp.seek=f;mvpPaint()}
function mvpLoop(){if(!mvp||mvp.audio.paused)return;mvpPaint();mvp.raf=requestAnimationFrame(mvpLoop)}
function mvpPaint(k){
  k=k||mvp?.k;if(!k)return;const live=!!mvp&&mvp.k===k,{f,txt}=live?mvpTimes():{f:0,txt:""},playing=live&&!mvp.audio.paused;
  const row=document.querySelector(`.mvrow[data-vk="${CSS.escape(k)}"]`);
  if(row){row.classList.toggle("on",live);row.classList.toggle("playing",playing);row.querySelector(".vpi").style.width=f*100+"%";row.querySelector(".vpt").textContent=txt}
  const bar=$("#mvpbar");if(bar&&live){bar.querySelector(".vpi").style.width=f*100+"%";bar.querySelector(".mpt").textContent=txt;bar.classList.toggle("playing",playing)}
}
function mvpBar(){
  const mv=$(".mv");let bar=$("#mvpbar");if(!mv||!mvp){bar?.remove();return}
  const r=mvp.r,c=byId[r[0]];if(!bar){bar=document.createElement("div");bar.id="mvpbar";bar.className="mvpbar";mv.append(bar)}
  bar.innerHTML=`${c?av(c):""}<div class="mpi"><b dir="auto">${esc(c?dn(c):"")}</b><small>${fullDate(r[2])} · <span class="mpt"></span></small><div class="vprog" data-mseek><i class="vpi"></i></div></div>
    <button class="ibtn mpp" data-mp="pp" title="${tr("تشغيل / إيقاف مؤقت")}">${IC.vplay}</button><button class="mpspd" data-mp="spd" title="${tr("السرعة")}">${rateTxt(vrate)}</button>
    <button class="ibtn" data-mp="go" title="${tr("الانتقال إلى الرسالة")}">${IC.goto}</button><button class="ibtn mpstop" data-mp="stop" title="${tr("إيقاف")}">${STOPI}</button>`;
}
function mvpClick(e){
  const sk=e.target.closest("[data-mseek]");if(sk&&mvp){const rc=sk.getBoundingClientRect();mvpSeek((e.clientX-rc.left)/rc.width);return true}
  const b=e.target.closest("[data-mp]");if(!b)return false;const a=b.dataset.mp;
  if(a==="pp"&&mvp)mvp.audio.paused?mvp.audio.play().catch(()=>{}):mvp.audio.pause();
  else if(a==="stop")mvpStop();
  else if(a==="spd"){vnSpeed();if(mvp)mvp.audio.playbackRate=vrate;b.textContent=rateTxt(vrate)}
  else if(a==="go"&&mvp){const r=mvp.r;mvGo(r)}
  return true;
}

/* ---------- keyboard & touch feedback ---------- */
// role=button elements (not <button>) activate with Enter / Space like buttons
document.addEventListener("keydown",e=>{if((e.key==="Enter"||e.key===" ")&&e.target.matches?.('[role="button"]:not(button)')){e.preventDefault();e.target.click()}});
// phone: a circular press highlight on buttons, a Material-style ripple from the touch point on rows and bubbles
const RIPSEL="button,.row,.srow,.sres,.bm,.mrow,.irow,.strow,.dlrow,.cmrow,.cmhead,.mvrow,.ctile,.ecell,.sacard,.m .b,.sav,[role=button]";
addEventListener("pointerdown",e=>{if(e.button||e.pointerType!=="touch"||RM.matches)return;
  const t=e.target.closest(RIPSEL);if(!t||t.disabled)return;
  const r=t.getBoundingClientRect(),round=t.tagName==="BUTTON"||t.classList.contains("sav"),
    x=round?r.width/2:e.clientX-r.left,y=round?r.height/2:e.clientY-r.top,d=round?Math.max(r.width,r.height)*1.1:Math.hypot(Math.max(x,r.width-x),Math.max(y,r.height-y))*2;
  const w=document.createElement("span");w.className="rw";w.innerHTML=`<i style="--x:${x}px;--y:${y}px;--d:${d}px"></i>`;t.append(w);setTimeout(()=>w.remove(),600)},{passive:true});

  schedulePoll(1500);syncStatus();setTimeout(loadPending,2000);
  await avP;
});
{const t0=performance.now(),sp=$("#splash"),hide=()=>{if(!sp||!sp.isConnected||sp.classList.contains("out"))return;sp.classList.add("out");setTimeout(()=>sp.remove(),400)};
  Promise.all([chatsP.catch(()=>{}),avP.catch(()=>{}),themeReady.catch(()=>{})]).then(()=>setTimeout(hide,Math.max(0,450-(performance.now()-t0))));setTimeout(hide,7000)}
